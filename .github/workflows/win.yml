name: Windows

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Windows 2025 MSVC [${{ matrix.build_type == 'Release' && 'Release Build' || 'Debug Tests' }}]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Enable long paths in Git
      shell: pwsh
      run: git config --system core.longpaths true

    - uses: actions/checkout@v3

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.18.0"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Python Test Dependencies
      if: matrix.build_type == 'Debug'
      run: python -m pip install pytest

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake $env:GITHUB_WORKSPACE -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache  -DWARNINGS_AS_ERRORS=ON -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel --target everything

    - name: Test C++
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -LE python --output-on-failure --timeout 30


    - name: Test Python
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -L python --output-on-failure --timeout 60

    - name: Install Ariadne Paving
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --install . --prefix "${{ runner.workspace }}/install"

    - name: Check Python Paving Tutorial
      if: matrix.build_type == 'Release'
      shell: pwsh
      working-directory: ${{ github.workspace }}/python/tutorials
      run: |
        $env:PYTHONPATH = "${{ runner.workspace }}\install\Lib\site-packages"
        $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
        python -c "import pyariadne; print(pyariadne.__file__)"
        python tutorial_paving.py


    - name: Prepare C++ Paving Tutorial
      if: matrix.build_type == 'Release'
      shell: pwsh
      run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_paving" "${{ runner.workspace }}/tutorial_paving"

    - name: Check C++ Paving Tutorial
      if: matrix.build_type == 'Release'
      shell: pwsh
      working-directory: ${{ runner.workspace }}/tutorial_paving
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache 
        cmake --build build --parallel
        $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
        & ".\build\tutorial_paving.exe"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


    - name: Verify Uninstallation
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --target uninstall
